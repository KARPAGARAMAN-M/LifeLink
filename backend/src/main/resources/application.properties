# LifeLink Application Configuration
spring.application.name=LifeLink

# Active Profile (override with SPRING_PROFILES_ACTIVE env variable)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port (Render provides PORT env variable)
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:myDefaultSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024}
jwt.expiration=86400000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

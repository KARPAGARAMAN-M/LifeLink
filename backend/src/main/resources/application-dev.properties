# Development Profile Configuration

# MySQL Database (Local)
spring.datasource.url=jdbc:mysql://localhost:3306/lifelink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Show SQL in dev
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Initialize sample data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Email Configuration (using Mailtrap for testing)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:your_mailtrap_username}
spring.mail.password=${MAIL_PASSWORD:your_mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000
